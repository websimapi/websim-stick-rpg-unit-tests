<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick RPG - Unit Tests</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 1rem;
            line-height: 1.4;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        
        .test-controls {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        
        button {
            padding: 0.5rem 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            color: #333;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:hover {
            background: #f0f0f0;
            transform: translateY(-1px);
        }
        
        .test-results {
            background: white;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 1rem;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 0.875rem;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .test-suite {
            margin-bottom: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
        
        .test-suite:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .test-suite h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: #555;
        }
        
        .test-case {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.25rem 0;
            font-size: 0.8125rem;
        }
        
        .test-status {
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.125rem 0.375rem;
            border-radius: 2px;
        }
        
        .status-fail { background: #e74c3c; color: white; }
        .status-pass { background: #27ae60; color: white; }
        .status-pending { background: #f39c12; color: white; }
        
        .coverage-info {
            margin-top: 1rem;
            font-size: 0.875rem;
            color: #666;
        }
        
        .progress-bar {
            height: 4px;
            background: #eee;
            border-radius: 2px;
            overflow: hidden;
            margin: 0.25rem 0;
        }
        
        .progress-fill {
            height: 100%;
            background: #3498db;
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .error {
            color: #e74c3c;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stick RPG Unit Tests</h1>
        
        <div class="test-controls">
            <button onclick="runAllTests()">All</button>
            <button onclick="runCharacterTests()">Character</button>
            <button onclick="runCombatTests()">Combat</button>
            <button onclick="runWorldTests()">World</button>
            <button onclick="runInventoryTests()">Inventory</button>
            <button onclick="runQuestTests()">Quest</button>
        </div>
        
        <div class="test-results" id="testResults">
            <p>Click a test button to run tests...</p>
        </div>
        
        <div class="coverage-info">
            <div class="progress-bar">
                <div class="progress-fill" id="coverageBar"></div>
            </div>
            <span id="coverageText">0/0 tests (0%)</span>
        </div>
    </div>

    <script type="module">
        import { runTests } from './test-runner.js';
        
        window.runAllTests = () => runTests('all');
        window.runCharacterTests = () => runTests('character');
        window.runCombatTests = () => runTests('combat');
        window.runWorldTests = () => runTests('world');
        window.runInventoryTests = () => runTests('inventory');
        window.runQuestTests = () => runTests('quest');
    </script>

</body>
</html>
